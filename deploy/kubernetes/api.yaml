apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsflow-api
  namespace: opsflow
  labels:
    app.kubernetes.io/name: opsflow-api
spec:
  # Start with one replica because the API applies database migrations and
  # seeds the first organization during startup.
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: opsflow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsflow-api
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - until nc -z postgres 5432 && nc -z redis 6379 && nc -z rabbitmq 5672; do echo 'waiting for OpsFlow dependencies'; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: api
          # Replace this image with the API ECR URL and an immutable commit tag.
          image: opsflow-api:replace-before-deploy
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: opsflow-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: opsflow-runtime-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opsflow-runtime-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opsflow-runtime-secrets
                  key: REDIS_PASSWORD
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: opsflow-runtime-secrets
                  key: RABBITMQ_USER
            - name: RabbitMq__UserName
              value: "$(RABBITMQ_USER)"
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: opsflow-runtime-secrets
                  key: RABBITMQ_PASSWORD
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);"
            - name: Redis__ConnectionString
              value: "redis:6379,password=$(REDIS_PASSWORD),abortConnect=false"
            - name: JwtSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: opsflow-runtime-secrets
                  key: JWT_SECRET_KEY
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: opsflow-api
  namespace: opsflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opsflow-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
